name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 -B -m unittest discover -s scripts -p 'test_*release.py'
      - run: npm run build
      - run: npm audit --omit=dev
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: --bundles msi,nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: --bundles msi,nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: --bundles dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked
      - name: Clean previous installers
        run: node -e "require('node:fs').rmSync('src-tauri/target/${{ matrix.target }}/release/bundle', {recursive:true, force:true})"
      - run: npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.bundle }}
      - name: Verify Windows installation and startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Target ${{ matrix.target }}
      - name: Collect verified Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = '${{ matrix.target }}'
          $platform = switch ($target) {
            'x86_64-pc-windows-msvc' { 'windows-x64' }
            'aarch64-pc-windows-msvc' { 'windows-arm64' }
            default { throw 'Unsupported Windows target' }
          }
          $destination = "artifacts/$target"
          New-Item -ItemType Directory -Path $destination
          $msi = @(Get-ChildItem "src-tauri/target/$target/release/bundle/msi/*.msi")
          $setup = @(Get-ChildItem "src-tauri/target/$target/release/bundle/nsis/*-setup.exe")
          if ($msi.Count -ne 1 -or $setup.Count -ne 1) { throw 'Expected one MSI and one setup executable' }
          Copy-Item $msi[0].FullName "$destination/prism-relay-$platform.msi"
          Copy-Item $setup[0].FullName "$destination/prism-relay-$platform-setup.exe"
      - name: Save verified Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30
      - name: Verify macOS installer contents and signature
        if: runner.os == 'macOS'
        run: bash scripts/smoke-macos.sh '${{ matrix.target }}'
      - name: Collect verified macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          case "$target" in
            aarch64-apple-darwin) platform=macos-apple-silicon ;;
            x86_64-apple-darwin) platform=macos-intel ;;
            *) exit 1 ;;
          esac
          destination="artifacts/$target"
          mkdir -p "$destination"
          installers=(src-tauri/target/"$target"/release/bundle/dmg/*.dmg)
          test "${#installers[@]}" -eq 1
          test -f "${installers[0]}"
          cp "${installers[0]}" "$destination/prism-relay-$platform.dmg"
      - name: Save verified macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30
