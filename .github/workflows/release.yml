name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64-portable
            bundle: --no-bundle
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64-portable
            bundle: --no-bundle
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-apple-silicon
            bundle: --bundles app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-intel
            bundle: --bundles app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked
      - run: npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.bundle }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts package
          cp -R "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Prism Relay.app" package/
          cp LICENSE README.md THIRD_PARTY_NOTICES.txt package/
          cp docs/release-notes.md package/RELEASE_NOTES.md
          ditto -c -k --sequesterRsrc --keepParent package "artifacts/prism-relay-${{ matrix.platform }}.zip"
      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts,package
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/prism-relay.exe" package/PrismRelay.exe
          Copy-Item LICENSE,README.md,THIRD_PARTY_NOTICES.txt package/
          Copy-Item docs/release-notes.md package/RELEASE_NOTES.md
          Compress-Archive -Path package/* -DestinationPath "artifacts/prism-relay-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*.zip
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Archive corresponding source
        run: git archive --format=tar.gz --prefix="prism-relay-$GITHUB_REF_NAME/" HEAD -o "artifacts/prism-relay-$GITHUB_REF_NAME-source.tar.gz"
      - name: Calculate checksums
        working-directory: artifacts
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Prism Relay $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
