name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundle: --bundles msi,nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            bundle: --bundles msi,nsis
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-apple-silicon
            bundle: --bundles dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-intel
            bundle: --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked
      - name: Clean previous installers
        run: node -e "require('node:fs').rmSync('src-tauri/target/${{ matrix.target }}/release/bundle', {recursive:true, force:true})"
      - run: npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.bundle }}
      - name: Verify Windows installation and startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Target ${{ matrix.target }}
      - name: Verify macOS installer contents and signature
        if: runner.os == 'macOS'
        run: bash scripts/smoke-macos.sh '${{ matrix.target }}'
      - name: Package macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "artifacts/prism-relay-${{ matrix.platform }}.dmg"
      - name: Package Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts
          $msi = @(Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi")
          $setup = @(Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe")
          if ($msi.Count -ne 1 -or $setup.Count -ne 1) { throw "Expected one MSI and one setup executable" }
          Copy-Item $msi[0].FullName "artifacts/prism-relay-${{ matrix.platform }}.msi"
          Copy-Item $setup[0].FullName "artifacts/prism-relay-${{ matrix.platform }}-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/check-version.mjs
      - run: python3 -B -m unittest discover -s scripts -p 'test_*release.py'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify installers and prepare source, provenance and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py --artifacts artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Prism Relay $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
